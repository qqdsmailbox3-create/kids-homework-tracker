<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>숙제 요정 체크 & 참 잘했어요</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #FFFDF7;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .font-cute { font-family: 'Jua', sans-serif; }
    
    .stamp-badge {
      display: inline-block;
      border: 4px dashed #EF4444;
      color: #DC2626;
      background: rgba(254, 226, 226, 0.95);
      font-family: 'Jua', sans-serif;
      transform: rotate(-8deg);
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3);
      animation: stampPunch 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    @keyframes stampPunch {
      0% { opacity: 0; transform: scale(3) rotate(-25deg); }
      70% { opacity: 1; transform: scale(0.92) rotate(-6deg); }
      100% { opacity: 1; transform: scale(1) rotate(-8deg); }
    }

    .done-text {
      text-decoration: line-through;
      color: #9CA3AF !important;
    }

    .speech-bubble {
      position: relative;
      background: #FEF3C7;
      border-radius: 1rem;
      border: 2px solid #FCD34D;
    }
    .speech-bubble:after {
      content: '';
      position: absolute;
      left: 20px;
      bottom: -8px;
      border-width: 8px 8px 0;
      border-style: solid;
      border-color: #FCD34D transparent;
      display: block;
      width: 0;
    }
  </style>
</head>
<body class="p-3 sm:p-5 max-w-xl mx-auto pb-24 text-slate-800">

  <!-- 헤더 바 -->
  <header class="flex items-center justify-between pb-3 pt-1 border-b border-amber-100">
    <div class="flex items-center gap-2">
      <div class="w-11 h-11 rounded-2xl bg-amber-400 text-white flex items-center justify-center text-2xl shadow-md">
        ⭐
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-xl font-cute text-amber-900 tracking-wide">숙제 요정 체크</h1>
          <span class="speech-bubble px-2 py-0.5 text-[11px] font-bold text-amber-9
